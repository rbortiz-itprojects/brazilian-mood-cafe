<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Gerenciar Cardápio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --cream:#FBF6EC; --ink:#2E1D14; --green:#1B4332; --gold:#E8A93D; --terracotta:#C1440E; --line:rgba(46,29,20,0.14); }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:'Work Sans', sans-serif; }
  header{ background:var(--green); color:#fff; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1{ font-family:'Fraunces'; margin:0; font-size:1.3rem; }
  header button{ background:transparent; border:1px solid rgba(255,255,255,0.5); color:#fff; padding:6px 14px; border-radius:8px; cursor:pointer; }

  #loginScreen{ max-width:360px; margin:80px auto; padding:24px; background:#fff; border-radius:14px; border:1px solid var(--line); }
  #loginScreen h2{ font-family:'Fraunces'; margin-top:0; }
  #loginScreen input{ width:100%; padding:10px; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; }
  #loginScreen button{ width:100%; background:var(--green); color:#fff; border:none; padding:12px; border-radius:8px; font-weight:700; cursor:pointer; }
  #loginError{ color:var(--terracotta); font-size:0.85rem; }

  main{ max-width:900px; margin:0 auto; padding:24px; }
  .panel{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:20px; }
  .panel h2{ font-family:'Fraunces'; margin-top:0; }
  table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  th, td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); font-size:0.9rem; vertical-align:top; overflow-wrap:break-word; }
  th{ font-family:'IBM Plex Mono'; font-size:0.75rem; text-transform:uppercase; color:#8a7a6d; }
  input, textarea, select{ width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-family:'Work Sans'; font-size:0.85rem; }
  textarea{ resize:vertical; min-height:38px; }
  input[data-field="image_url"]{ font-family:'IBM Plex Mono'; font-size:0.72rem; text-overflow:ellipsis; }
  .row-actions{ display:flex; flex-direction:column; gap:6px; width:100%; }
  .row-actions button{ width:100%; padding:6px 10px; border-radius:6px; border:none; cursor:pointer; font-size:0.8rem; }
  .btn-save{ background:var(--green); color:#fff; }
  .btn-delete{ background:var(--terracotta); color:#fff; }
  .btn-add{ background:var(--gold); color:var(--ink); border:none; padding:10px 18px; border-radius:8px; font-weight:700; cursor:pointer; margin-top:10px; }
  .active-toggle{ display:flex; align-items:center; gap:6px; }
  .table-scroll{ overflow-x:auto; }
</style>
</head>
<body>

<div id="loginScreen">
  <h2>Login administrativo</h2>
  <input type="email" id="loginEmail" placeholder="E-mail">
  <input type="password" id="loginPassword" placeholder="Senha">
  <button onclick="doLogin()">Entrar</button>
  <p id="loginError"></p>
  <p style="font-size:0.8rem;color:#8a7a6d;">Crie o usuário admin em Supabase &gt; Authentication &gt; Users.</p>
</div>

<div id="app" style="display:none;">
  <header>
    <h1>Gerenciar Cardápio</h1>
    <button onclick="logout()">Sair</button>
  </header>
  <main>
    <div class="panel">
      <h2>Categorias</h2>
      <div class="table-scroll">
      <table id="catTable">
        <colgroup>
          <col style="width:auto;"><col style="width:70px;"><col style="width:70px;"><col style="width:100px;">
        </colgroup>
        <thead><tr><th>Nome</th><th>Ordem</th><th>Ativa</th><th></th></tr></thead>
        <tbody id="catBody"></tbody>
      </table>
      </div>
      <button class="btn-add" onclick="addCategoryRow()">+ Nova categoria</button>
    </div>

    <div class="panel">
      <h2>Itens do cardápio</h2>
      <div class="table-scroll">
      <table id="itemTable">
        <colgroup>
          <col style="width:100px;"><col style="width:120px;"><col style="width:200px;">
          <col style="width:70px;"><col style="width:220px;"><col style="width:130px;">
          <col style="width:60px;"><col style="width:100px;">
        </colgroup>
        <thead><tr><th>Categoria</th><th>Nome</th><th>Descrição</th><th>Preço (R$)</th><th>Imagem (URL)</th><th>Obs.</th><th>Ativo</th><th></th></tr></thead>
        <tbody id="itemBody"></tbody>
      </table>
      </div>
      <button class="btn-add" onclick="addItemRow()">+ Novo item</button>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script>
let categories = [], items = [];

async function checkSession(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session){ showApp(); } else { showLogin(); }
}
function showLogin(){ document.getElementById('loginScreen').style.display='block'; document.getElementById('app').style.display='none'; }
function showApp(){ document.getElementById('loginScreen').style.display='none'; document.getElementById('app').style.display='block'; loadAll(); }

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error){ document.getElementById('loginError').textContent = error.message; return; }
  showApp();
}
async function logout(){ await supabaseClient.auth.signOut(); showLogin(); }

async function loadAll(){
  const { data: cats } = await supabaseClient.from('categories').select('*').order('sort_order');
  const { data: mi } = await supabaseClient.from('menu_items').select('*').order('sort_order');
  categories = cats || []; items = mi || [];
  renderCategories(); renderItems();
}

function renderCategories(){
  document.getElementById('catBody').innerHTML = categories.map(c => `
    <tr data-id="${c.id}">
      <td><input value="${c.name}" data-field="name"></td>
      <td style="width:70px;"><input type="number" value="${c.sort_order}" data-field="sort_order"></td>
      <td class="active-toggle"><input type="checkbox" ${c.active?'checked':''} data-field="active"></td>
      <td>
        <div class="row-actions">
          <button class="btn-save" onclick="saveCategory('${c.id}', this)">Salvar</button>
          <button class="btn-delete" onclick="deleteCategory('${c.id}')">Excluir</button>
        </div>
      </td>
    </tr>`).join('');
}

function collectRow(tr){
  const out = {};
  tr.querySelectorAll('[data-field]').forEach(el => {
    const f = el.dataset.field;
    out[f] = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? Number(el.value) : el.value);
  });
  return out;
}

async function saveCategory(id, btn){
  const tr = btn.closest('tr');
  const patch = collectRow(tr);
  await supabaseClient.from('categories').update(patch).eq('id', id);
  loadAll();
}
async function deleteCategory(id){
  if (!confirm('Excluir esta categoria e todos os seus itens?')) return;
  await supabaseClient.from('categories').delete().eq('id', id);
  loadAll();
}
async function addCategoryRow(){
  const name = prompt('Nome da nova categoria:');
  if (!name) return;
  await supabaseClient.from('categories').insert({ name, sort_order: categories.length + 1, active: true });
  loadAll();
}

function renderItems(){
  document.getElementById('itemBody').innerHTML = items.map(i => `
    <tr data-id="${i.id}">
      <td style="width:120px;">
        <select data-field="category_id">
          ${categories.map(c => `<option value="${c.id}" ${c.id===i.category_id?'selected':''}>${c.name}</option>`).join('')}
        </select>
      </td>
      <td><input value="${i.name}" data-field="name"></td>
      <td><textarea data-field="description">${i.description||''}</textarea></td>
      <td style="width:80px;"><input type="number" step="0.01" value="${(i.price_cents/100).toFixed(2)}" data-field="price"></td>
      <td><input value="${i.image_url||''}" data-field="image_url" title="${(i.image_url||'').replace(/"/g,'&quot;')}"></td>
      <td><input value="${i.notes||''}" data-field="notes"></td>
      <td class="active-toggle"><input type="checkbox" ${i.active?'checked':''} data-field="active"></td>
      <td>
        <div class="row-actions">
          <button class="btn-save" onclick="saveItem('${i.id}', this)">Salvar</button>
          <button class="btn-delete" onclick="deleteItem('${i.id}')">Excluir</button>
        </div>
      </td>
    </tr>`).join('');
}

async function saveItem(id, btn){
  const tr = btn.closest('tr');
  const raw = collectRow(tr);
  const patch = {
    category_id: raw.category_id,
    name: raw.name,
    description: raw.description,
    price_cents: Math.round(Number(raw.price) * 100),
    image_url: raw.image_url,
    notes: raw.notes,
    active: raw.active,
    updated_at: new Date().toISOString()
  };
  await supabaseClient.from('menu_items').update(patch).eq('id', id);
  loadAll();
}
async function deleteItem(id){
  if (!confirm('Excluir este item?')) return;
  await supabaseClient.from('menu_items').delete().eq('id', id);
  loadAll();
}
async function addItemRow(){
  if (!categories.length){ alert('Crie uma categoria primeiro.'); return; }
  await supabaseClient.from('menu_items').insert({
    category_id: categories[0].id, name: 'Novo item', description: '', price_cents: 0,
    image_url: '', notes: '', active: true, sort_order: items.length + 1
  });
  loadAll();
}

checkSession();
</script>
</body>
</html>
