<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Brazilian Mood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#FAF6EC;
    --ink:#1B2A36;
    --navy:#0C2F4F;
    --blue:#14588F;
    --green:#1E6B3C;
    --gold:#C9A04F;
    --gold-deep:#8F6A22;
    --gold-bright:#E8A92A;
    --terracotta:var(--blue);
    --line: rgba(27,42,54,0.14);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Work Sans', sans-serif;
    padding-bottom: 110px;
  }
  header.top{
    background:var(--navy); color:var(--cream);
    padding:18px 20px 30px;
    position:relative; text-align:center;
    border-bottom:3px solid var(--gold);
  }
  header.top img.logo{ height:96px; width:auto; display:block; margin:0 auto 6px; }
  header.top::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:14px;
    background-image: radial-gradient(circle at 7px 0, transparent 7px, var(--navy) 7.5px);
    background-size: 14px 14px;
    background-position: 0 -7px;
  }
  header.top h1{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  header.top .table-tag{
    font-family:'IBM Plex Mono', monospace; font-size:0.8rem;
    color:var(--gold-bright); letter-spacing:0.08em; text-transform:uppercase;
  }
  nav.cats{
    display:flex; gap:8px; overflow-x:auto; padding:18px 16px 4px;
    position:sticky; top:0; background:var(--cream); z-index:5;
    border-bottom:1px solid var(--line);
  }
  nav.cats button{
    flex:0 0 auto; border:1px solid var(--line); background:#fff;
    color:var(--ink); padding:8px 16px; border-radius:999px;
    font-family:'Work Sans'; font-weight:600; font-size:0.85rem;
    cursor:pointer;
  }
  nav.cats button.active{ background:var(--navy); border-color:var(--navy); color:var(--gold-bright); }

  main{ padding:16px; max-width:640px; margin:0 auto; }
  section.category h2{
    font-family:'Fraunces', serif; font-size:1.2rem; margin:26px 0 12px;
  }
  .item-card{
    display:flex; gap:12px; background:#fff; border:1px solid var(--line);
    border-radius:var(--radius); padding:12px; margin-bottom:10px;
  }
  .item-card img{
    width:78px; height:78px; object-fit:cover; border-radius:10px; flex:0 0 auto;
    background:#eee;
  }
  .item-info{ flex:1; min-width:0; }
  .item-info h3{ margin:0 0 4px; font-size:1rem; font-family:'Work Sans'; font-weight:600; }
  .item-info p.desc{ margin:0 0 6px; font-size:0.85rem; color:#4a5963; line-height:1.35; }
  .item-info p.notes{ margin:0 0 6px; font-size:0.75rem; color:var(--gold-deep); font-style:italic; }
  .item-row-bottom{ display:flex; align-items:center; justify-content:space-between; }
  .price{ font-family:'IBM Plex Mono', monospace; font-weight:500; }
  button.add-btn{
    background:var(--green); color:#fff; border:none; border-radius:8px;
    padding:6px 14px; font-weight:600; cursor:pointer; font-size:0.85rem;
  }
  .qty-controls{ display:flex; align-items:center; gap:8px; }
  .qty-controls button{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-size:1rem; line-height:1;
  }

  /* Cart bar */
  #cartBar{
    position:fixed; left:16px; right:16px; bottom:16px; background:var(--green); color:#fff; border:2px solid var(--gold);
    padding:16px 22px; border-radius:14px; display:none; align-items:center; justify-content:space-between;
    cursor:pointer; font-weight:700; box-shadow:0 6px 20px rgba(12,47,79,0.4);
    z-index:15; transition:transform 0.15s ease;
  }
  #cartBar:active{ transform:scale(0.97); }
  #cartBar .cart-left{ display:flex; align-items:center; gap:10px; }
  #cartBar .badge{
    background:rgba(255,255,255,0.25); border-radius:999px; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-size:0.9rem;
  }
  #cartBar .cta{ display:flex; align-items:center; gap:6px; }
  #cartBar .cta .arrow{ font-size:1.1rem; }

  /* Cart drawer */
  #overlay{ position:fixed; inset:0; background:rgba(12,47,79,0.55); display:none; z-index:20; }
  #drawer{
    position:fixed; right:0; top:0; bottom:0; width:100%; max-width:420px;
    background:var(--cream); z-index:21; transform:translateX(100%);
    transition:transform 0.25s ease; display:flex; flex-direction:column;
  }
  #drawer.open{ transform:translateX(0); }
  #overlay.open{ display:block; }
  .drawer-head{ padding:20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .drawer-head h2{ font-family:'Fraunces'; margin:0; }
  .drawer-body{ flex:1; overflow-y:auto; padding:16px 20px; }
  .cart-line{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line); }
  .cart-line .notes-input{
    width:100%; margin-top:4px; font-size:0.8rem; padding:5px 8px; border:1px solid var(--line);
    border-radius:6px; font-family:'Work Sans';
  }
  .drawer-foot{ padding:16px 20px 24px; border-top:1px solid var(--line); }
  .total-row{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono'; font-weight:600; margin-bottom:14px; font-size:1.05rem; }
  input[type=text], input[type=tel]{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    font-family:'Work Sans'; font-size:0.95rem; margin-bottom:10px;
  }
  label.checkbox{ display:flex; align-items:center; gap:8px; font-size:0.85rem; margin-bottom:14px; }
  button.primary{
    width:100%; background:var(--green); color:#fff; border:none; border-radius:10px;
    padding:14px; font-weight:700; font-size:1rem; cursor:pointer; font-family:'Work Sans';
  }
  button.primary:disabled{ opacity:0.5; cursor:not-allowed; }
  #confirmScreen{ text-align:center; padding:60px 24px; }
  #confirmScreen h2{ font-family:'Fraunces'; }
  #confirmScreen .stamp{
    font-family:'IBM Plex Mono'; background:var(--gold-bright); color:var(--ink);
    display:inline-block; padding:8px 18px; border-radius:8px; margin:16px 0; font-weight:600;
  }
</style>
</head>
<body>

<header class="top">
  <img class="logo" src="logo.png" alt="Brazilian Mood, authentic taste">
  <h1>Brazilian Mood</h1>
  <div class="table-tag" id="tableTag">Table —</div>
</header>

<nav class="cats" id="catNav"></nav>

<main id="menuRoot"></main>

<div id="cartBar" onclick="openDrawer()">
  <div class="cart-left">
    <span class="badge" id="cartCount">0</span>
    <span id="cartTotalTag">$0.00</span>
  </div>
  <div class="cta">Review order <span class="arrow">→</span></div>
</div>

<div id="overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="drawer-head">
    <h2>Your order</h2>
    <button onclick="closeDrawer()" style="background:none;border:none;font-size:1.4rem;cursor:pointer;">&times;</button>
  </div>
  <div class="drawer-body" id="cartLines"></div>
  <div class="drawer-foot" id="checkoutForm">
    <div class="total-row"><span>Total</span><span id="drawerTotal">$0.00</span></div>
    <input type="text" id="custName" placeholder="Your first name *" required>
    <input type="tel" id="custPhone" placeholder="Mobile number (optional, for SMS updates)" inputmode="tel">
    <label class="checkbox">
      <input type="checkbox" id="smsOptIn">
      Text me updates about my order
    </label>
    <button class="primary" id="sendOrderBtn" onclick="submitOrder()">Send order to the kitchen</button>
  </div>
</div>

<div id="confirmScreen" style="display:none;">
  <h2>Order sent! 🎉</h2>
  <p>The kitchen has your order.</p>
  <div class="stamp" id="orderRef"></div>
  <p>Take a seat and relax. We'll let you know when it's ready.</p>
</div>

<script src="config.js"></script>
<script>
let categories = [];
let items = [];
let cart = {}; // menu_item_id -> {item, qty, notes}
const params = new URLSearchParams(location.search);
const tableNumber = params.get('table') || '?';
document.getElementById('tableTag').textContent = `Table ${tableNumber}`;

// Turns 0412 345 678 into +61412345678 (needed for SMS delivery)
function normalisePhone(raw){
  let d = raw.replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d;
  if (d.startsWith('0')) return '+61' + d.slice(1);
  if (d.startsWith('61')) return '+' + d;
  return d;
}

function money(cents){ return '$' + (cents/100).toFixed(2); }

function showMenuMessage(msg){
  document.getElementById('menuRoot').innerHTML =
    `<p style="text-align:center;padding:48px 16px;color:#5c4b3f;">${msg}</p>`;
}

async function loadMenu(){
  try {
    const { data: cats, error: e1 } = await supabaseClient.from('categories').select('*').eq('active', true).order('sort_order');
    const { data: mi, error: e2 } = await supabaseClient.from('menu_items').select('*').eq('active', true).order('sort_order');
    if (e1 || e2){
      console.error('Menu load error:', e1 || e2);
      showMenuMessage('We couldn\'t load the menu. Please ask a staff member for help.');
      return;
    }
    categories = cats || []; items = mi || [];
    if (!items.length){
      showMenuMessage('The menu is empty right now. Please ask a staff member for help.');
      return;
    }
    renderNav(); renderMenu();
  } catch (err){
    console.error('Menu load failed:', err);
    showMenuMessage('We couldn\'t connect to the menu. Please check your connection or ask a staff member for help.');
  }
}

function renderNav(){
  const nav = document.getElementById('catNav');
  nav.innerHTML = categories.map((c,i) =>
    `<button data-id="${c.id}" class="${i===0?'active':''}" onclick="scrollToCat('${c.id}', this)">${c.name}</button>`
  ).join('');
}

function scrollToCat(id, btn){
  document.querySelectorAll('#catNav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('cat-'+id).scrollIntoView({behavior:'smooth', block:'start'});
}

function renderMenu(){
  const root = document.getElementById('menuRoot');
  root.innerHTML = categories.map(c => {
    const catItems = items.filter(i => i.category_id === c.id);
    if (!catItems.length) return '';
    return `<section class="category" id="cat-${c.id}">
      <h2>${c.name}</h2>
      ${catItems.map(renderItem).join('')}
    </section>`;
  }).join('');
}

function renderItem(item){
  return `<div class="item-card">
    ${item.image_url ? `<img src="${item.image_url}" alt="${item.name}">` : ''}
    <div class="item-info">
      <h3>${item.name}</h3>
      ${item.description ? `<p class="desc">${item.description}</p>` : ''}
      ${item.notes ? `<p class="notes">${item.notes}</p>` : ''}
      <div class="item-row-bottom">
        <span class="price">${money(item.price_cents)}</span>
        <div id="ctrl-${item.id}">
          <button class="add-btn" onclick="addToCart('${item.id}')">Add</button>
        </div>
      </div>
    </div>
  </div>`;
}

function addToCart(id){
  const item = items.find(i => i.id === id);
  if (!cart[id]) cart[id] = { item, qty: 0, notes: '' };
  cart[id].qty++;
  refreshItemControl(id);
  refreshCartBar();
}
function changeQty(id, delta){
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  refreshItemControl(id);
  refreshCartBar();
  renderCartLines();
}
function refreshItemControl(id){
  const el = document.getElementById('ctrl-'+id);
  if (!el) return;
  const line = cart[id];
  if (!line) { el.innerHTML = `<button class="add-btn" onclick="addToCart('${id}')">Add</button>`; return; }
  el.innerHTML = `<div class="qty-controls">
    <button onclick="changeQty('${id}',-1)">−</button>
    <span>${line.qty}</span>
    <button onclick="changeQty('${id}',1)">+</button>
  </div>`;
}

function cartTotal(){
  return Object.values(cart).reduce((sum,l) => sum + l.item.price_cents * l.qty, 0);
}
function cartCount(){
  return Object.values(cart).reduce((sum,l) => sum + l.qty, 0);
}
function refreshCartBar(){
  const bar = document.getElementById('cartBar');
  const n = cartCount();
  bar.style.display = n > 0 ? 'flex' : 'none';
  document.getElementById('cartCount').textContent = n;
  document.getElementById('cartTotalTag').textContent = money(cartTotal());
  document.getElementById('drawerTotal').textContent = money(cartTotal());
}

function renderCartLines(){
  const wrap = document.getElementById('cartLines');
  const lines = Object.entries(cart);
  if (!lines.length){ wrap.innerHTML = '<p style="color:#8a7a6d;">Your order is empty.</p>'; return; }
  wrap.innerHTML = lines.map(([id,l]) => `
    <div class="cart-line">
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;">
          <strong>${l.qty}x ${l.item.name}</strong>
          <span class="price">${money(l.item.price_cents * l.qty)}</span>
        </div>
        <input class="notes-input" placeholder="Any notes? (e.g. no sugar)"
          value="${l.notes}" onchange="setNote('${id}', this.value)">
      </div>
    </div>
  `).join('');
}
function setNote(id, val){ cart[id].notes = val; }

function openDrawer(){
  renderCartLines();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

async function submitOrder(){
  const name = document.getElementById('custName').value.trim();
  const phone = normalisePhone(document.getElementById('custPhone').value.trim());
  const smsOptIn = document.getElementById('smsOptIn').checked;
  if (!name){ alert('Please enter your first name.'); return; }
  if (!cartCount()){ alert('Your order is empty.'); return; }

  const btn = document.getElementById('sendOrderBtn');
  btn.disabled = true; btn.textContent = 'Sending...';

  const { data: order, error } = await supabaseClient.from('orders').insert({
    table_number: parseInt(tableNumber) || 0,
    customer_name: name,
    customer_phone: phone || null,
    sms_opt_in: smsOptIn && !!phone,
    total_cents: cartTotal(),
    status: 'new'
  }).select().single();

  if (error){ alert('Sorry, we couldn\'t send your order: ' + error.message); btn.disabled=false; btn.textContent='Send order to the kitchen'; return; }

  const lineItems = Object.values(cart).map(l => ({
    order_id: order.id,
    menu_item_id: l.item.id,
    name_snapshot: l.item.name,
    price_cents_snapshot: l.item.price_cents,
    quantity: l.qty,
    notes: l.notes || ''
  }));
  await supabaseClient.from('order_items').insert(lineItems);

  closeDrawer();
  document.querySelector('main').style.display = 'none';
  document.getElementById('catNav').style.display = 'none';
  document.getElementById('cartBar').style.display = 'none';
  document.getElementById('confirmScreen').style.display = 'block';
  document.getElementById('orderRef').textContent = 'ORDER #' + order.id.slice(0,8).toUpperCase();
}

loadMenu();
</script>
</body>
</html>
