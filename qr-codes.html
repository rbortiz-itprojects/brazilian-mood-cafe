<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Codes — Mesas</title>
<style>
  body{ font-family:sans-serif; background:#f2f2f2; padding:24px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; }
  .card{ background:#fff; border-radius:12px; padding:16px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
  .card h2{ margin:6px 0; }
  .card img{ width:180px; height:180px; }
  input{ width:280px; padding:8px; margin:8px 0; }
  @media print { body{ background:#fff; } input, button.controls{ display:none; } }
</style>
</head>
<body>
  <h1>Gerador de QR Codes das mesas</h1>
  <!-- <p>Base URL da página do cliente — sua URL de produção do Vercel, sem barra no final (ex: <code>https://brazilian-mood-cafe.vercel.app</code>):</p> -->
  <input type="text" id="baseUrl" value="https://brazilian-mood-cafe.vercel.app" onchange="render()">
  <p>Número de mesas: <input type="number" id="numTables" value="5" style="width:60px;" onchange="render()"></p>
  <div class="grid" id="grid"></div>

<script>
function render(){
  const base = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
  const n = parseInt(document.getElementById('numTables').value) || 1;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 1; i <= n; i++){
    const url = `${base}/index.html?table=${i}`;
    const qrImgSrc = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<h2>Mesa ${i}</h2><img src="${qrImgSrc}" alt="QR mesa ${i}"><p style="font-size:0.75rem;word-break:break-all;">${url}</p>`;
    grid.appendChild(div);
  }
}
render();
</script>
</body>
</html>
